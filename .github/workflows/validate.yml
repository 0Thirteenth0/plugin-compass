name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Validate schemas and contract models
        run: python -m unittest tests.test_builder_models -v

      - name: Run repository-wide suite
        run: python -m unittest discover -s tests -v

      - name: Run explicit integration modules
        run: python -m unittest tests.test_builder_verifier tests.test_builder_integrator tests.test_builder_cleanup -v

      - name: Run repository harness self-tests
        run: python -m unittest tests.test_repo_harness -v

      - name: Check Git diff hygiene
        run: git diff --check
